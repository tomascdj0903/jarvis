name: Build & Release Jarvis

# Publie une release à chaque changement de version dans jarvis/__init__.py
on:
  push:
    branches: [main]
    paths: ["jarvis/__init__.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Lire la version
        id: ver
        shell: pwsh
        run: |
          $v = (python -c "import re;print(re.search(r'\"(.+?)\"', open('jarvis/__init__.py').read()).group(1))").Trim()
          "tag=v$v" >> $env:GITHUB_OUTPUT
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import openwakeword.utils as u; u.download_models(['hey_jarvis'])"
      - name: Construire Jarvis.exe
        shell: pwsh
        run: |
          $oww = (python -c "import openwakeword,os;print(os.path.dirname(openwakeword.__file__))").Trim()
          pyinstaller --noconfirm --clean --windowed --name Jarvis `
            --icon assets\jarvis.ico --add-data "assets;assets" --add-data "$oww;openwakeword" `
            --collect-all onnxruntime --collect-all edge_tts --collect-all sounddevice `
            --hidden-import pystray._win32 run_jarvis.py
          Compress-Archive -Path dist\Jarvis -DestinationPath Jarvis-Windows.zip
      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: J.A.R.V.I.S. ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: Jarvis-Windows.zip
          generate_release_notes: true
