name: Build & Release Jarvis

# Publication automatique : dès que la version dans jarvis/__init__.py n'a pas encore de release.
# Vérifié à chaque push sur main ET toutes les 15 minutes (au cas où un push ne déclenche rien).
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -E 's/.*"(.+)".*/\1/' jarvis/__init__.py)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "v$v déjà publiée"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "v$v à publier"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Tests unitaires
        run: |
          pip install requests
          python tests/test_core.py
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import openwakeword.utils as u; u.download_models(['hey_jarvis'])"
      - name: Construire Jarvis.exe
        shell: pwsh
        run: |
          $oww = (python -c "import openwakeword,os;print(os.path.dirname(openwakeword.__file__))").Trim()
          pyinstaller --noconfirm --clean --windowed --name Jarvis `
            --icon assets\jarvis.ico --add-data "assets;assets" --add-data "$oww;openwakeword" `
            --collect-all onnxruntime --collect-all edge_tts --collect-all sounddevice `
            --hidden-import pystray._win32 run_jarvis.py
      - name: Auto-test du .exe (tout est-il bien embarqué ?)
        shell: pwsh
        run: |
          $p = Start-Process dist\Jarvis\Jarvis.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content dist\Jarvis\selftest.txt
          if ($p.ExitCode -ne 0) { throw "Auto-test échoué" }
          Remove-Item dist\Jarvis\selftest.txt
      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path dist\Jarvis -DestinationPath Jarvis-Windows.zip
      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: J.A.R.V.I.S. ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: Jarvis-Windows.zip
          generate_release_notes: true
