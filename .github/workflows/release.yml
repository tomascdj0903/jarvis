name: Build & Release Jarvis

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import openwakeword.utils as u; u.download_models(['hey_jarvis'])"
      - name: Version depuis le tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          Set-Content jarvis/__init__.py "__version__ = `"$v`""
      - name: Construire Jarvis.exe
        shell: pwsh
        run: |
          $oww = (python -c "import openwakeword,os;print(os.path.dirname(openwakeword.__file__))").Trim()
          pyinstaller --noconfirm --clean --windowed --name Jarvis `
            --icon assets\jarvis.ico --add-data "assets;assets" --add-data "$oww;openwakeword" `
            --collect-all onnxruntime --collect-all edge_tts --collect-all sounddevice `
            --hidden-import pystray._win32 run_jarvis.py
          Compress-Archive -Path dist\Jarvis -DestinationPath Jarvis-Windows.zip
      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Jarvis-Windows.zip
          generate_release_notes: true
      - name: Artefact (lancement manuel)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows
          path: Jarvis-Windows.zip
