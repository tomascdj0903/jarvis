      <stop offset="0%" stop-color="#0B1A2E"/>
      <stop offset="100%" stop-color="#03060C"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#9FF0FF"/>
      <stop offset="100%" stop-color="#29D8FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#29D8FF" stroke-opacity=".25" stroke-width="4"/>
  <!-- outer segmented ring -->
  <circle cx="256" cy="256" r="178" fill="none" stroke="#29D8FF" stroke-width="14" stroke-dasharray="52 18" stroke-linecap="round" opacity=".9"/>
  <!-- gold ring -->
